version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ap_postgres
    restart: always
    environment:
      POSTGRES_USER: ap_user
      POSTGRES_PASSWORD: ap_password_2026
      POSTGRES_DB: ap_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ap_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ap_backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://ap_user:ap_password_2026@db:5432/ap_automation
      SECRET_KEY: enterprise_super_secret_jwt_key_ap_automation_2026
      STORAGE_DIR: /app/backend/app/uploads
      OCR_PROVIDER: tesseract
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/backend/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ap_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads_data:
